<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="NEXUS logo">
  <!-- NEXUS mark — navy pointy-top hexagon, white isometric N weave
       redrawn as vector from the official club badge -->
  <polygon points="50.00,2.00 91.57,26.00 91.57,74.00 50.00,98.00 8.43,74.00 8.43,26.00" fill="#16294A" stroke="#3D5A8F" stroke-width="1.4"/>
  <polygon points="50.00,14.00 81.18,32.00 81.18,68.00 50.00,86.00 18.82,68.00 18.82,32.00" fill="none" stroke="#7FA3D8" stroke-width="1.6" opacity="0.32"/>
  <g fill="#EFF5FF">
    <!-- left stem (iso-capped prism) -->
    <path d="M26 35 L35 30.5 L35 64.5 L26 69 Z"/>
    <!-- right stem -->
    <path d="M65 30.5 L74 35 L74 69 L65 64.5 Z"/>
    <!-- diagonal ribbon, 30deg iso slope, tucks into both stems -->
    <path d="M26 36.5 L35 32 L74 56.5 L65 61 Z"/>
  </g>
</svg>
